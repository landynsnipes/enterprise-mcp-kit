apiVersion: v1
kind: ConfigMap
metadata: { name: site-content-__REVISION__-__PIPELINE__, namespace: cloud-reference-chi }
data:
  index.html: |
    {"service":"cloud-reference","status":"healthy","site":"chi","revision":"__REVISION__","pipeline":"__PIPELINE__","physicalFailureDomain":"shared-wsl-host","autonomousRemediation":false}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-reference
  namespace: cloud-reference-chi
  annotations: { aiops.openenterprise.dev/decision-trace-id: "gitlab-pipeline-__PIPELINE__" }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: cloud-reference } }
  template:
    metadata:
      labels: { app: cloud-reference, aiops.site: chi, trust-zone: workload }
      annotations: { aiops.openenterprise.dev/decision-trace-id: "gitlab-pipeline-__PIPELINE__" }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: docker.io/nginxinc/nginx-unprivileged@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
          ports: [{ name: http, containerPort: 8080 }]
          volumeMounts: [{ name: content, mountPath: /usr/share/nginx/html, readOnly: true }, { name: runtime-tmp, mountPath: /tmp }]
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes: [{ name: content, configMap: { name: site-content-__REVISION__-__PIPELINE__ } }, { name: runtime-tmp, emptyDir: { medium: Memory, sizeLimit: 16Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: cloud-reference, namespace: cloud-reference-chi }
spec: { type: NodePort, selector: { app: cloud-reference }, ports: [{ name: http, port: 80, targetPort: http, nodePort: 30081 }] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: cloud-reference-chi }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller, namespace: cloud-reference-chi }
spec:
  podSelector: { matchLabels: { app: cloud-reference } }
  policyTypes: [Ingress]
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }], ports: [{ protocol: TCP, port: 8080 }] }]

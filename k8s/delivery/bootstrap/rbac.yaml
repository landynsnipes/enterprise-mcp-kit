apiVersion: v1
kind: Namespace
metadata: { name: aiops-delivery-system }
---
apiVersion: v1
kind: Namespace
metadata:
  name: cloud-reference
  labels: { app.kubernetes.io/part-of: open-enterprise-aiops, aiops.site: las }
---
apiVersion: v1
kind: Namespace
metadata:
  name: cloud-reference-chi
  labels: { app.kubernetes.io/part-of: open-enterprise-aiops, aiops.site: chi }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: gitlab-deployer, namespace: aiops-delivery-system }
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-deployer-token
  namespace: aiops-delivery-system
  annotations: { kubernetes.io/service-account.name: gitlab-deployer }
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: gitlab-deployer, namespace: cloud-reference }
rules:
  - apiGroups: ['']
    resources: [configmaps, services]
    verbs: [get, list, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments/status]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: gitlab-deployer, namespace: cloud-reference }
subjects:
  - { kind: ServiceAccount, name: gitlab-deployer, namespace: aiops-delivery-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: gitlab-deployer }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: gitlab-deployer, namespace: cloud-reference-chi }
rules:
  - apiGroups: ['']
    resources: [configmaps, services]
    verbs: [get, list, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments/status]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: gitlab-deployer, namespace: cloud-reference-chi }
subjects:
  - { kind: ServiceAccount, name: gitlab-deployer, namespace: aiops-delivery-system }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: gitlab-deployer }

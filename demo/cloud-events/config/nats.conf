server_name: "enterprise-aiops-cloud-events"
jetstream: { store_dir: "/data/jetstream", max_memory_store: 64MB, max_file_store: 256MB }
http: 8222
authorization {
  users = [
    { user: "__NATS_API_USER__", password: "__NATS_API_PASSWORD_BCRYPT__", permissions: { publish: ["aiops.cloud.events.v1", "aiops.cloud.receipts.v1.*", "$JS.API.>"], subscribe: ["_INBOX.>"] } },
    { user: "__NATS_WORKER_USER__", password: "__NATS_WORKER_PASSWORD_BCRYPT__", permissions: { publish: ["$JS.API.>", "$JS.ACK.>"], subscribe: ["_INBOX.>"] } }
  ]
}
max_payload: 65536
write_deadline: "5s"

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    environment: wsl-lab
    platform: open-enterprise-aiops
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: wireguard-two-site
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9108']
        labels:
          service: wireguard-site-connectivity
          decision_trace_id: dtr_wireguard_netns_v1
  - job_name: cloud-event-api
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8790']
        labels: { service: cloud-event-api, site_scope: local-evaluation }
  - job_name: cloud-event-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8791']
        labels: { service: cloud-event-worker, site_scope: local-evaluation }
